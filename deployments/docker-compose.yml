services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  origin:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.origin
    ports:
      - "9090:9090"
    environment:
      - ORIGIN_ID=origin-1
      - ORIGIN_PORT=9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  edge-us-east:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.edge
    ports:
      - "8081:8080"
    environment:
      - EDGE_ID=edge-us-east-1
      - EDGE_REGION=us-east-1
      - EDGE_PORT=8080
      - REDIS_ADDR=redis:6379
      - ORIGIN_BACKENDS=http://origin:9090
    depends_on:
      redis:
        condition: service_healthy
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  edge-us-west:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.edge
    ports:
      - "8082:8080"
    environment:
      - EDGE_ID=edge-us-west-1
      - EDGE_REGION=us-west-1
      - EDGE_PORT=8080
      - REDIS_ADDR=redis:6379
      - ORIGIN_BACKENDS=http://origin:9090
    depends_on:
      redis:
        condition: service_healthy
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  edge-eu-west:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.edge
    ports:
      - "8083:8080"
    environment:
      - EDGE_ID=edge-eu-west-1
      - EDGE_REGION=eu-west-1
      - EDGE_PORT=8080
      - REDIS_ADDR=redis:6379
      - ORIGIN_BACKENDS=http://origin:9090
    depends_on:
      redis:
        condition: service_healthy
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  router:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.router
    ports:
      - "80:80"
      - "9091:9091"
    environment:
      - ROUTER_PORT=80
      - ROUTER_STRATEGY=latency
      - ORIGIN_BACKENDS=http://origin:9090
      - ROUTER_EDGES=us-east-1=edge-us-east:8080,us-west-1=edge-us-west:8080,eu-west-1=edge-eu-west:8080
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data: