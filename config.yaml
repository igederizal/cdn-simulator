edge:
  id: "edge-local-1"
  region: "local"
  port: 8080
  redis_addr: "localhost:6379"
  capacity: 10000
  enable_compression: true
  compression_level: 5

origin:
  id: "origin-local-1"
  port: 9090
  backends:
    - "http://localhost:9090"

router:
  port: 80
  strategy: "latency"
  health_check_interval: 10
  geo_db_path: ""

cache:
  default_ttl: 300
  max_ttl: 86400
  stale_while_revalidate: 60
  max_object_size: 104857600
  enable_tags: true
  enable_stale: true

metrics:
  port: 9091
  path: "/metrics"
  enabled: true

logging:
  level: "info"
  format: "json"